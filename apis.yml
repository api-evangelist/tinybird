aid: tinybird
name: Tinybird
description: >-
  Tinybird is a real-time data platform that allows you to ingest, process, and expose data through low-latency,
  high-concurrency APIs. The platform supports real-time analytics at scale with a SQL-based transformation layer and
  instant REST API endpoint publishing.
